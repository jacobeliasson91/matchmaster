function bind(){document.querySelectorAll('.zone').forEach(z=>{z.ondragover=e=>{e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');let g=state.games.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(!g)return;let pitch=pitches.find(x=>x[0]===z.dataset.p),d=at(z.dataset.d+'T12:00:00'),y=e.clientY-z.getBoundingClientRect().top,m=Math.round((480+y/800*600)/15)*15;m=Math.max(480,Math.min(1065,m));if(!compat(g,pitch[0]))return show('Spelformen '+(type(g)||'okänd')+' passar inte på '+pitch[1]+'.');if(!windowOK(g,pitch[0],m)&&pitch[0]!=='e')return show('Tiden ligger utanför planens bokningspass.');let old=g.manualStart||g.timeAsDateTime||g.time,dt=at(old);dt.setHours(Math.floor(m/60),m%60,0,0);g.manualStart=dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())+'T'+pad(dt.getHours())+':'+pad(dt.getMinutes())+':00';g.date=z.dataset.d;g.pitch=pitch[0];g.placed=true;if(conflict(g,g.pitch,d)){g.placed=false;g.pitch=null;return show('Tiden krockar med en annan match. Välj en ledig yta.')}save();draw();toast('Matchen flyttad. Avsparkstiden är uppdaterad.')}})}

function edit(g){let t=prompt('Spelform (5 mot 5, 7 mot 7, 9 mot 9, 11 mot 11). Lämna tomt för API-värdet:',g.typeOverride||'');if(t===null)return;if(t.trim()&&!['5 mot 5','7 mot 7','9 mot 9','11 mot 11'].includes(t.trim()))return show('Spelform måste vara 5, 7, 9 eller 11 mot '+t.trim().match(/^\\d+/)?.[0]+'.');g.typeOverride=t.trim()||'';let v=prompt('Avspark: YYYY-MM-DD HH:mm',g.date+' '+(g.manualStart||g.timeAsDateTime||'').slice(11,16));if(v){let a=v.split(' ');if(!a[0]||!a[1])return show('Ange YYYY-MM-DD HH:mm');g.date=a[0];g.manualStart=a[0]+'T'+a[1]+':00'}save();draw()}
function auto(){state.games.forEach(g=>{g.placed=false;g.pitch=null});let sorted=state.games.filter(g=>!g.canceled).sort((a,b)=>(parseInt(type(b))||0)-(parseInt(type(a))||0)||a.date.localeCompare(b.date));let ok=0;for(let g of sorted){let d=at(g.date+'T12:00:00'),opts=pitches.filter(p=>p[0]!=='e'&&compat(g,p[0])&&windowOK(g,p[0]));for(let p of opts)if(!conflict(g,p[0],d)){g.pitch=p[0];g.placed=true;ok++;break}}save();draw();show('Planering klar: '+ok+' av '+sorted.length+' matcher placerades; '+(sorted.length-ok)+' behöver hanteras manuellt.')}
function normalize(x){let arr=Array.isArray(x)?x:(x.games||x.data?.games||[]),id=Number(x.clubId||state.clubId);state.clubId=id;state.clubName=x.clubName||state.clubName;return arr.filter(g=>Number(g.homeClubId)===id).map(g=>({id:String(g.gameId),homeTeamName:(g.homeTeamName||'').trim(),awayTeamName:(g.awayTeamName||'').trim(),competitionName:g.competitionName||'',timeAsDateTime:g.timeAsDateTime||g.time||'',date:(g.timeAsDateTime||g.time||'').slice(0,10),pitch:null,placed:false,canceled:!!g.isCanceled,postponed:!!g.isPostponed,withoutTime:!!g.isWithoutConfirmedTime,venuePitchTypeName:g.venuePitchTypeName||'',venueName:g.venueName||'',type:g.venuePitchTypeName||''}))}
function applyImport(x){let incoming=normalize(x);if(!incoming.length){show('Inga hemmamatcher hittades med homeClubId '+state.clubId+'.');return}let old=new Map(state.games.map(g=>[g.id,g]));incoming.forEach(g=>{let o=old.get(g.id);if(o){g.pitch=o.pitch;g.placed=o.placed;g.manualStart=o.manualStart;g.typeOverride=o.typeOverride;g.manualPlacement=o.manualPlacement}});state.games=incoming;save();draw();show('Importerade '+incoming.length+' hemmamatcher. Avsparkstiderna är bevarade.')}
async function syncFromApi(){if(!sb||!sbSession)return show('Logga in via Supabase-knappen först.');if(location.protocol==='file:')return show('För att importera matcher behöver appen öppnas via GitHub Pages eller en lokal webbserver.');let from=iso(new Date()),to=iso(plus(new Date(),365));show('Hämtar hemmamatcher från SvFF…');let result;try{result=await sb.functions.invoke('svff-games',{body:{from,to}})}catch(e){return show('Kunde inte nå Supabase-funktionen. Kontrollera Project URL, internet och att svff-games är publicerad.')}let {data,error}=result;if(error){let status=error.context?.status;if(status)return show('Importen nådde Supabase men fick HTTP '+status+'. Kontrollera Edge Functions → svff-games → Logs; kontrollera också att Verify JWT är aktiverat och att SVFF_API_KEY finns.');return show('Webbläsaren kunde inte nå Edge Function. Kontrollera att svff-games är publicerad i samma Supabase-projekt som appen.')}if(data&&data.error)return show('Importfel: '+data.error);applyImport(data)}
function importJSON(file){let r=new FileReader();r.onload=()=>{try{applyImport(JSON.parse(r.result))}catch(e){show('JSON-filen kunde inte läsas: '+e.message)}};r.readAsText(file)}
function open(kind){let title=document.querySelector('#mtitle'),body=document.querySelector('#body');if(kind==='supabase'){title.textContent='Supabase-anslutning';body.innerHTML='<p>Ange projektets URL, publika nyckel och användarkonto. SvFF-nyckeln ska bara sparas som secret i Supabase Edge Functions.</p><label>Project URL</label><input id="sburl" placeholder="https://project-ref.supabase.co" value="'+esc(sbConfig.url||'')+'"><label>Publishable key / anon key</label><input id="sbkey" placeholder="sb_publishable_… eller eyJ…" value="'+esc(sbConfig.key||'')+'"><div class="rules"><b>E-post</b><input id="sbemail" type="email" autocomplete="username"><b>Lösenord</b><input id="sbpassword" type="password" autocomplete="current-password"></div><p><button class="primary" id="sbconnect">Spara och logga in</button> <button id="sbrefresh">Hämta matcher från SvFF</button> <button id="sbsignout">Logga ut</button></p><p class="note">Status: '+(sbSession?'inloggad':'inte inloggad')+'. Publishable/anon key får finnas i webbsidan när RLS används. Lägg aldrig service-role eller SvFF-nyckeln här.</p>';setTimeout(()=>{document.querySelector('#sbconnect').onclick=saveSupabaseConfig;document.querySelector('#sbrefresh').onclick=syncFromApi;document.querySelector('#sbsignout').onclick=signOutSupabase},0)}else if(kind==='schema'){title.textContent='Schema och import';body.innerHTML='<p>Importera SvFF API-svaret som JSON. Appen väljer automatiskt hemmamatcher där <code>homeClubId</code> matchar klubbnumret.</p><label>Klubb-ID</label><input id="cid" type="number" value="'+state.clubId+'"><p>Utan Supabase sparas planeringen lokalt. När du är inloggad synkas matcher och planändringar till databasen. SvFF-nyckeln ska aldrig klistras in här.</p><p><button class="primary" id="choose">Välj JSON-fil</button> <button id="sample">Ladda exempelmatcher</button> <button id="clear">Rensa matcher</button></p>';setTimeout(()=>{document.querySelector('#cid').onchange=e=>{state.clubId=Number(e.target.value);save()};document.querySelector('#choose').onclick=()=>document.querySelector('#file').click();document.querySelector('#sample').onclick=sample;document.querySelector('#clear').onclick=()=>{if(confirm('Rensa alla matcher?')){state.games=[];save();draw();close()}}},0)}else if(kind==='plans'){title.textContent='Planer & tider';body.innerHTML='<p>Fasta bokningspass används vid automatisk placering. Importerade tider ändras inte.</p><div class="rules"><b>Plan 1</b><span>5 mot 5: 08:30–10:00 och 10:30–12:00 på varsin halva. 11 mot 11: hela planen 12:30–14:45, avspark 13:00.</span><b>Plan 2</b><span>7 mot 7: 09:30–11:15 och 11:30–13:15 på varsin halva. 9 mot 9: hela planen 13:30–15:30.</span><b>Plan 5</b><span>Reserv för 7- och 9-manna, manuell placering.</span><b>Tillgänglighet</b><span>08:00–18:00.</span></div>'}else{title.textContent='Planeringsregler';body.innerHTML='<div class="rules"><b>Import</b><span>Hämta hemmamatcher via homeClubId. Bevara API:ts avspark.</span><b>Automatik</b><span>Fördela på lämplig ledig planhalva utan att ändra matchtid. Krockar lämnas opplacerade.</span><b>Spelform</b><span>Fältet venuePitchTypeName används. Saknad/okänd spelform ska kontrolleras manuellt.</span><b>Drag & drop</b><span>Manuell flytt till nytt klockslag ändrar avspark och kontrollerar krock och bokningspass.</span><b>Plan 5</b><span>Ingår inte i automatisk placering.</span></div>'}document.querySelector('#modal').classList.add('open')}
function close(){document.querySelector('#modal').classList.remove('open')}
function sample(){state.games=[['d1','Skabersjö IF F10','Vellinge IF','F10 Sydvästra','2026-10-24T09:00:00','5 mot 5'],['d2','Skabersjö IF P11','Svedala IF','P11 Sydvästra','2026-10-24T10:00:00','7 mot 7'],['d3','Skabersjö IF P14','Hyllie IK','P14 Sydvästra','2026-10-24T12:00:00','9 mot 9'],['d4','Skabersjö IF Herr','Lunds BK','Division 5','2026-10-25T13:00:00','11 mot 11']].map(x=>({id:x[0],homeTeamName:x[1],awayTeamName:x[2],competitionName:x[3],timeAsDateTime:x[4],date:x[4].slice(0,10),type:x[5],pitch:null,placed:false}));save();draw();close();show('Exempelmatcher inlästa. Klicka Generera om för planförslag.')}
document.querySelector('#prev').onclick=()=>{state.date=plus(state.date,-7);draw()};document.querySelector('#next').onclick=()=>{state.date=plus(state.date,7);draw()};document.querySelector('#today').onclick=()=>{state.date=new Date();draw()};document.querySelector('#date').onchange=e=>{state.date=at(e.target.value+'T12:00:00');draw()};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let d=+b.dataset.d;if(state.days.has(d)){if(state.days.size>1)state.days.delete(d)}else state.days.add(d);b.classList.toggle('on',state.days.has(d));draw()});document.querySelector('#filter').onchange=e=>{state.filter=e.target.value;draw()};document.querySelector('#regen').onclick=auto;document.querySelector('#import').onclick=()=>{if(sb&&sbSession)syncFromApi();else if(sbConfig.url&&sbConfig.key)open('supabase');else document.querySelector('#file').click()};document.querySelector('#file').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));document.querySelector('#close').onclick=close;document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')close()};
draw();initSupabase();</script></body></html>
